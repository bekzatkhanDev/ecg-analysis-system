services:

  # ── Backend (FastAPI + PyTorch) ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      DATABASE_URL: sqlite:////data/ecg_analysis.db
      MODEL_WEIGHTS_PATH: /app/best_model_500hz.pth
      CORS_ORIGINS: "http://localhost,http://localhost:80"
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    volumes:
      # Persist SQLite database across container restarts / re-deployments
      - db_data:/data
    expose:
      # Backend is only reachable by the nginx proxy, not from the host
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - internal

  # ── Frontend (React → nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Relative URL — nginx on the same host proxies /api/ to the backend
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

# ── Named volumes ────────────────────────────────────────────────────────────
volumes:
  db_data:
    driver: local

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
